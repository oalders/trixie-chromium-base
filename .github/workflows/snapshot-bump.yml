---
name: Snapshot Bump Reminder

# On the 1st of each month: build-validate the Dockerfile at a candidate
# DEBIAN_SNAPSHOT (no push), so the chromium launch smoke check runs, check the
# tools image's package sets still resolve on it, and open
# a reminder issue saying whether the candidate is safe to bump to. The bump
# itself stays a manual PR.

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      snapshot_date:
        description: 'Candidate DEBIAN_SNAPSHOT (YYYYMMDDT000000Z). Empty = first of current month.'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  validate-and-remind:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Compute candidate and current snapshot
        id: snapshot
        env:
          SNAPSHOT_DATE_INPUT: ${{ inputs.snapshot_date }}
        run: |
          CANDIDATE=$(bash scripts/snapshot-candidate.sh "$SNAPSHOT_DATE_INPUT")
          CURRENT=$(bash scripts/snapshot-current.sh)
          echo "candidate=$CANDIDATE" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Candidate: $CANDIDATE"
          echo "Current:   $CURRENT"

      # A scheduled run already at the candidate is a no-op; a manual dispatch
      # always re-validates.
      - name: Determine whether to proceed
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          CANDIDATE: ${{ steps.snapshot.outputs.candidate }}
          CURRENT: ${{ steps.snapshot.outputs.current }}
        run: |
          PROCEED=$(bash scripts/snapshot-should-proceed.sh "$EVENT_NAME" "$CANDIDATE" "$CURRENT")
          echo "proceed=$PROCEED" >> "$GITHUB_OUTPUT"
          echo "Proceed: $PROCEED"

      - name: Set up Docker Buildx
        if: steps.gate.outputs.proceed == 'true'
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build (validate) image with candidate snapshot
        id: build
        if: steps.gate.outputs.proceed == 'true'
        continue-on-error: true
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: candidate:local
          build-args: |
            DEBIAN_SNAPSHOT=${{ steps.snapshot.outputs.candidate }}

      # The tools image installs its package sets on this image's base, so check
      # they still resolve at the candidate snapshot.
      - name: Validate tools package sets resolve
        id: tools
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: bash scripts/validate-tools-packages.sh candidate:local

      # always(): a failed Buildx setup must still be reported, as FAILED.
      - name: Open reminder issue
        if: always() && steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CANDIDATE: ${{ steps.snapshot.outputs.candidate }}
          CURRENT: ${{ steps.snapshot.outputs.current }}
          OUTCOME: ${{ steps.build.outcome == 'success' && steps.tools.outcome || steps.build.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/open-reminder-issue.sh "$REPO" "$CANDIDATE" "$CURRENT" "$OUTCOME" "$RUN_URL"
