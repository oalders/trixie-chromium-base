---
name: Publish

# Builds the image on PRs that touch it (no push) and publishes it to GHCR on
# main as
# ghcr.io/<owner>/<repo>:<DEBIAN_SNAPSHOT>-<12 hex of the Dockerfile's sha256>.
# Consumers pin the digest printed in the job summary.

on:
  push:
    branches: [main]
    paths: [Dockerfile, scripts/**, .github/workflows/publish.yml]
  pull_request:
    paths: [Dockerfile, scripts/**, .github/workflows/publish.yml]
  workflow_dispatch:

# Serialize publishes per ref so two main runs can't both see the tag absent and
# race to push; superseded PR builds are cancelled.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Compute image tag
        id: tag
        run: bash scripts/tag-outputs.sh "$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # Reruns and non-Dockerfile pushes reuse an already-published tag; a
      # published tag is never rebuilt, since consumers pin its digest.
      - name: Look up existing tag
        id: existing
        if: env.PUBLISH == 'true'
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          DIGEST=$(bash scripts/existing-digest.sh "$IMAGE")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Build (and push on main)
        id: build
        if: steps.existing.outputs.digest == ''
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: ${{ env.PUBLISH == 'true' }}
          provenance: false
          sbom: false
          tags: ${{ steps.tag.outputs.image }}
          build-args: |
            DEBIAN_SNAPSHOT=${{ steps.tag.outputs.snapshot }}

      - name: Print pinned reference
        if: env.PUBLISH == 'true'
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          DIGEST: ${{ steps.existing.outputs.digest || steps.build.outputs.digest }}
        run: bash scripts/print-pin.sh "$IMAGE" "$DIGEST"
